description = '猪灵身体模板、金囊占位器官和身体出生规则。'

dependencies {
    api 'local.meridian:server'
    implementation 'dev.kizuna.meridian.human:server'
    implementation 'dev.kizuna.meridian.humanoid:server'
    implementation 'dev.kizuna.meridian.technique:server'
    testImplementation libs.junit4
}

sourceSets {
    tooling {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def contentDirectory = layout.buildDirectory.dir('generated/piglin-content')
def exportBundle = tasks.register('exportPiglinBundle', JavaExec) {
    classpath = sourceSets.tooling.runtimeClasspath
    mainClass = 'dev.kizuna.meridian.piglin.tooling.ExportPiglinBundle'
    args contentDirectory.get().asFile.absolutePath
    inputs.files(sourceSets.main.output, configurations.runtimeClasspath)
    outputs.dir(contentDirectory)
}
tasks.named('jar') { from(exportBundle) }
tasks.named('test') {
    useJUnit()
    dependsOn exportBundle
    classpath += files(contentDirectory)
}
